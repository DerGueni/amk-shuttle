<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17181C">
<title>AMK Live 2026 · Crew-Shuttle</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<style>
:root{
  --case:#17181C; --panel:#1F2126; --panel2:#26282E; --line:#33363E;
  --ink:#FFFFFF; --dim:#FFFFFF; --tape:#FFD23F; --now:#FF4B3E; --ok:#64A85C;
  --rowhover:#2A2D34;
  --disp:Arial,Helvetica,sans-serif;
  --body:Calibri,'Segoe UI',Arial,Helvetica,sans-serif;
  --mono:Arial,Helvetica,sans-serif;
  --tape-ink:#FFD23F; --tape-sig:#FFD23F;
  --ok-ink:#BFE6B8; --now-ink:#FFB4AD;
  --vanbody:#3A404A; --vanline:#828997; --vanglas:#46505F;
  --vaninnen:#1C1F24; --vanrad:#0C0D10; --vanhaube:#333844; --vanlicht:#FFE9A8; --vanruecklicht:#C2453B;
  --frei-bg:#23262C; --frei-line:#5A5F6B;
  --zoom:1;
}
:root[data-theme="light"]{
  --case:#F1F1F1; --panel:#FFFFFF; --panel2:#E6E6E6; --line:#C4C4C4;
  --ink:#000000; --dim:#000000; --rowhover:#DCDCDC;
  --tape-ink:#141518; --tape-sig:#A24B00;
  --ok-ink:#1F6B2E; --now-ink:#A32017;
  --vanbody:#FFFFFF; --vanline:#7E838D; --vanglas:#C3CFDF;
  --vaninnen:#E9EBEE; --vanrad:#2F323A; --vanhaube:#F2F3F5; --vanlicht:#FFE9A8; --vanruecklicht:#D6534A;
  --frei-bg:#F6F6F6; --frei-line:#8A8F99;
}
*{box-sizing:border-box;margin:0;padding:0}
html{zoom:var(--zoom,1);-webkit-text-size-adjust:100%}
body{background:var(--case);color:var(--ink);font-family:var(--body);
  font-variant-numeric:tabular-nums;font-size:16px;line-height:1.4;padding-bottom:80px}

/* ---------- Kopf ---------- */
header{background:var(--panel);border-bottom:3px solid var(--tape);padding:12px 16px 10px;position:sticky;top:0;z-index:40}
.kicker{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--tape-ink)}
h1{font-family:var(--disp);font-size:clamp(18px,4.5vw,26px);margin:2px 0}
.sub{font-size:14px;color:var(--dim)}
.hdrgear{position:absolute;top:10px;right:12px;background:var(--panel2);border:1px solid var(--line);
  border-radius:6px;color:var(--tape-ink);font-size:18px;line-height:1;padding:7px 10px;cursor:pointer}
@media (max-width:560px){header{padding-right:58px}}

/* ---------- Tabs ---------- */
.tabs{display:flex;margin:14px 16px 0;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.tabs button{flex:1 1 0;min-width:62px;background:var(--panel);border:none;color:var(--dim);
  font-family:var(--disp);font-weight:700;font-size:13px;padding:11px 3px;cursor:pointer;position:relative}
@media (max-width:560px){.tabs button{font-size:12px;min-width:78px;padding:10px 2px}}
.tabs button.active{background:var(--tape);color:#161616}
.tabs button+button{border-left:1px solid var(--line)}
.tabs .zaehler{display:inline-block;min-width:18px;padding:0 4px;margin-left:5px;border-radius:9px;
  background:var(--now);color:#fff;font-size:11px;font-weight:700;vertical-align:1px}
.tabs button.active .zaehler{background:#161616;color:var(--tape)}

/* ---------- Blöcke ---------- */
.sec{margin:14px 16px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin:18px 16px 6px;gap:10px;flex-wrap:wrap}
.sechead h2{font-family:var(--disp);font-size:15px}
.sechead span{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--dim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:10px}
.card.hl{border-color:var(--tape);box-shadow:0 0 0 1px var(--tape)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:3px}
.hint{margin:10px 16px;font-size:14px;color:var(--dim);border-left:3px solid var(--line);padding-left:9px}
.hint.tape{border-color:var(--tape)}
.hint.warn{border-color:var(--now)}
.leer{padding:22px 12px;text-align:center;color:var(--dim);font-size:14px}

/* ---------- Knöpfe ---------- */
button.btn{font-family:var(--disp);font-weight:700;font-size:14px;border-radius:6px;padding:9px 14px;
  cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
button.btn:hover{background:var(--rowhover)}
button.btn.pri{background:var(--tape);border-color:var(--tape);color:#161616}
button.btn.ok{background:var(--ok);border-color:var(--ok);color:#161616}
button.btn.warn{background:var(--now);border-color:var(--now);color:#fff}
button.btn.klein{font-size:13px;padding:6px 10px}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.btnzeile{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Marken ---------- */
.badge{font-family:var(--mono);font-size:12px;border-radius:3px;padding:2px 7px;font-weight:700;display:inline-block}
.b-tape{background:var(--tape);color:#161616}
.b-ok{background:var(--ok);color:#161616}
.b-warn{background:var(--now);color:#fff}
.b-plan{background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.b-zu{background:#5a2b28;color:#ffb4ad}
:root[data-theme="light"] .b-zu{background:#F6D8D5;color:#A32017}

/* ---------- Formularfelder ---------- */
label.feld{display:block;font-family:var(--disp);font-weight:700;font-size:13px;margin:10px 0 4px;color:var(--dim)}
input,select,textarea{font-family:var(--body);font-size:15px;background:var(--panel2);color:var(--ink);
  border:1px solid var(--line);border-radius:5px;padding:8px 9px;width:100%}
textarea{min-height:90px;resize:vertical;line-height:1.45}
.fzeile{display:flex;gap:10px;flex-wrap:wrap}
.fzeile>div{flex:1 1 150px}

/* ---------- Sitzplan ---------- */
.vanwrap{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px}
.vanmap{display:block;max-width:460px;margin:0 auto}
.vanmap.klein{max-width:186px}
.seat .seatbox{fill:var(--frei-bg);stroke:var(--frei-line);stroke-width:2}
.seat .seatlehne{fill:var(--frei-line);opacity:.55}
.seat .seattext{font-family:var(--disp);font-weight:700;font-size:19px;fill:var(--ink);text-anchor:middle}
.seat .seatsub{font-family:var(--disp);font-size:10px;fill:var(--dim);opacity:.85;text-anchor:middle}
.seat.frei .seatbox{stroke-dasharray:5 4}
.seat.frei .seattext{fill:var(--tape-sig);font-size:24px}
.seat.klickbar:hover .seatbox{stroke:var(--tape);stroke-width:3}
.seat.angefragt .seatbox{fill:#4A3D12;stroke:var(--tape);stroke-dasharray:5 4}
.seat.angefragt .seatlehne{fill:var(--tape);opacity:.8}
.seat.bestaetigt .seatbox{fill:#22401F;stroke:var(--ok)}
.seat.bestaetigt .seatlehne{fill:var(--ok)}
.seat.gesperrt .seatbox{fill:var(--panel2);stroke:var(--line)}
.seat.gesperrt .seattext{font-size:15px;opacity:.75}
.seat.fahrer .seatbox{fill:var(--vanglas);stroke:var(--vanline)}
.seat.fahrer .seatlehne{fill:var(--vanline);opacity:.6}
.seat .lenkrad{fill:none;stroke:var(--vanline);stroke-width:3}
.seat .lenkradnabe{fill:var(--vanline)}
.seat.ich .seatbox{stroke:var(--ink);stroke-width:3.5}
:root[data-theme="light"] .seat.angefragt .seatbox{fill:#FFF0C2}
:root[data-theme="light"] .seat.bestaetigt .seatbox{fill:#DDF0D9}
.legende{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:10px;font-size:13px}
.legende span{display:flex;align-items:center;gap:6px}
.lp{width:15px;height:15px;border-radius:4px;border:2px solid var(--frei-line);background:var(--frei-bg);display:inline-block}
.lp.a{background:#4A3D12;border-color:var(--tape)} .lp.b{background:#22401F;border-color:var(--ok)}
.lp.g{background:var(--panel2);border-color:var(--line)}
:root[data-theme="light"] .lp.a{background:#FFF0C2} :root[data-theme="light"] .lp.b{background:#DDF0D9}

/* ---------- Shuttle-Karte ---------- */
.shuttlegrid{display:flex;gap:12px;flex-wrap:wrap}
.shuttlecard{flex:1 1 300px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.shuttlecard h3{font-family:var(--disp);font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kfz{font-family:var(--mono);font-weight:700;font-size:12px;background:var(--panel2);border:1px solid var(--line);
  border-radius:4px;padding:2px 7px;letter-spacing:.5px}
.meta{font-size:13px;color:var(--dim);margin-top:3px}
.balken{height:7px;border-radius:4px;background:var(--panel2);overflow:hidden;margin:9px 0 4px}
.balken i{display:block;height:100%;background:var(--ok)}
.balken i.voll{background:var(--now)}

/* ---------- Listen ---------- */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--disp);font-size:12px;text-align:left;color:var(--dim);
  border-bottom:1px solid var(--line);padding:6px 7px;white-space:nowrap}
td{padding:7px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:var(--rowhover)}
.tabwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px}

/* ---------- Besetzungs-Dashboard ---------- */
.dash{display:flex;gap:14px;align-items:flex-start;margin:12px 16px}
.dashlinks{flex:0 0 310px;max-height:72vh;overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:10px}
.dashrechts{flex:1;min-width:0}
@media (max-width:860px){.dash{flex-direction:column}.dashlinks{flex:none;width:100%;max-height:46vh}}
.crewrow{display:flex;align-items:center;gap:9px;padding:6px 7px;border-radius:6px;cursor:pointer;
  border:1px solid transparent;user-select:none;-webkit-user-select:none}
.crewrow:hover{background:var(--rowhover)}
.crewrow.gewaehlt{border-color:var(--tape);background:var(--panel2)}
.crewrow.verplant .cname{opacity:.55}
.crewrow.selbst .cname{font-style:italic;opacity:.7}
.kchip{min-width:36px;height:27px;padding:0 5px;border-radius:5px;display:flex;align-items:center;
  justify-content:center;font-family:var(--disp);font-weight:700;font-size:12.5px;
  background:var(--panel2);border:1px solid var(--line);flex:0 0 auto}
.cname{flex:1;min-width:0;font-size:14.5px;line-height:1.25}
.cname small{display:block;font-size:12px;opacity:.8}
.sitzchip{font-family:var(--mono);font-size:11.5px;font-weight:700;background:var(--ok);color:#161616;
  border-radius:3px;padding:2px 5px;flex:0 0 auto}
.sitzchip.offen{background:var(--tape);color:#161616}
.gwkopf{font-family:var(--disp);font-weight:700;font-size:12.5px;color:var(--tape-ink);
  margin:12px 0 3px;border-bottom:1px solid var(--line);padding-bottom:3px}
.dashkopf{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 16px}
.dashkopf select,.dashkopf input{width:auto;min-width:130px}
.seat.wahl .seatbox{stroke:var(--tape);stroke-width:4.5}
.kmenu{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px;
  z-index:150;box-shadow:0 8px 26px rgba(0,0,0,.55);min-width:225px;max-width:88vw}
.kmenu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink);
  font-family:var(--body);font-size:14.5px;padding:9px 10px;border-radius:5px;cursor:pointer}
.kmenu button:hover{background:var(--rowhover)}
.kmenu .kkopf{font-family:var(--disp);font-weight:700;font-size:12.5px;color:var(--tape-ink);padding:5px 10px}
.kmenu .trenn{height:1px;background:var(--line);margin:4px 2px}

/* ---------- Dialog ---------- */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:100}
.dlg{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--tape);border-radius:8px;
  padding:16px;max-width:520px;width:100%;max-height:88vh;overflow:auto}
.dlg h2{font-family:var(--disp);font-size:17px;margin-bottom:8px}
.dlg p{font-size:14px;margin-bottom:6px}
.dlgbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel);
  border:1px solid var(--tape);border-radius:6px;padding:10px 16px;font-size:14px;z-index:200;max-width:90vw}

/* ---------- WhatsApp-Vorschau ---------- */
.wa{background:#0B141A;border-radius:10px;padding:14px 12px;border:1px solid var(--line)}
.wabubble{background:#005C4B;color:#E9EDEF;border-radius:9px 0 9px 9px;padding:9px 11px;font-size:14.5px;
  white-space:pre-wrap;line-height:1.5;margin-left:auto;max-width:min(460px,94%);font-family:'Segoe UI',Arial,sans-serif}
.wabubble .link{color:#53BDEB;text-decoration:underline;word-break:break-all}
.wazeit{display:block;text-align:right;font-size:11px;color:#8FA3AD;margin-top:4px}
.pre{white-space:pre-wrap;font-family:var(--body);font-size:14px;background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:11px;line-height:1.5}

footer{margin:26px 16px 10px;font-size:12.5px;color:var(--dim);opacity:.85;text-align:center}
.hide{display:none!important}
</style>
</head>
<body>

<header>
  <div class="kicker">AMK LIVE 2026 · CREW</div>
  <h1>Shuttle-Planung</h1>
  <div class="sub" id="kopfsub">Hotel ↔ Venue · Plätze selbst buchen</div>
  <button class="hdrgear" id="btnEinst" title="Einstellungen">⚙</button>
</header>

<div class="tabs" id="tabs"></div>
<main id="main"></main>
<footer>
  AMK Shuttle · Demo-Stand · Alle Daten liegen nur in diesem Browser (kein Server).
</footer>

<script src="qr.js"></script>
<script src="shuttle_fahrzeuge.js"></script>
<script>
'use strict';
/* ==========================================================
   AMK Shuttle — Sitzplatz-Buchung für die Crew
   Ein einziges Formular, läuft auch ohne Internet (file://).
   ========================================================== */

/* ---------- kleine Helfer ---------- */
function el(tag, cls, txt){var e=document.createElement(tag); if(cls)e.className=cls;
  if(txt!==undefined&&txt!==null)e.textContent=txt; return e;}
function $(id){return document.getElementById(id);}
function leeren(n){while(n.firstChild)n.removeChild(n.firstChild);return n;}
function uid(p){return (p||'x')+Math.random().toString(36).slice(2,9);}
function pad(n){return (n<10?'0':'')+n;}
function heuteISO(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function plusTage(iso,n){var t=new Date(iso+'T12:00:00');t.setDate(t.getDate()+n);return heuteISO(t);}
var WOCHENTAG=['So','Mo','Di','Mi','Do','Fr','Sa'];
function datumLang(iso){if(!iso)return '';var d=new Date(iso+'T12:00:00');
  return WOCHENTAG[d.getDay()]+'. '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();}
function datumKurz(iso){if(!iso)return '';var d=new Date(iso+'T12:00:00');
  return WOCHENTAG[d.getDay()]+' '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.';}
function jetzt(){return new Date();}
function fahrtZeitpunkt(f){return new Date(f.datum+'T'+(f.zeit||'00:00')+':00');}
function minutenBis(f){return Math.round((fahrtZeitpunkt(f)-jetzt())/60000);}
function restText(f){
  var m=minutenBis(f);
  if(m<-120) return 'gefahren';
  if(m<0) return 'unterwegs';
  if(m<60) return 'in '+m+' Min';
  var h=Math.floor(m/60), r=m%60;
  if(h<24) return 'in '+h+' Std'+(r?' '+r+' Min':'');
  return 'in '+Math.round(h/24)+' Tagen';
}

/* ---------- Zustand ---------- */
var LS='amk_shuttle_v1';
var S=null, merk={};
var ansicht={tab:'fahrten', fahrtId:null, tag:null, crewWahl:null, sitzWahl:null,
              suche:'', nurOhne:false, empf:'crew', textArt:'ansage', fahrtWahl:null};

function speichern(){
  try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){merk[LS]=JSON.stringify(S);}
}
function laden(){
  var j=null;
  try{j=localStorage.getItem(LS);}catch(e){j=merk[LS]||null;}
  if(!j){S=demoDaten(); speichern(); return;}
  try{S=JSON.parse(j);}catch(e){S=demoDaten();speichern();}
  if(!S||!S.fahrten){S=demoDaten();speichern();}
  if(!S.einst)S.einst=demoDaten().einst;
  if(!S.protokoll)S.protokoll=[];
  nachziehen();
}
/* Ältere Stände auf den neuen Aufbau heben (Touren, Gewerke, Textvorlagen). */
function nachziehen(){
  if(!S.touren||!S.touren.length){
    var d=demoDaten();
    S.touren=d.touren;
    S.einst.tourId=d.einst.tourId;
    S.textvorlagen=S.textvorlagen||d.textvorlagen;
  }
  var tid=S.einst.tourId||S.touren[0].id;
  ['crew','fahrzeuge','fahrten','tagesvorlagen'].forEach(function(k){
    (S[k]||[]).forEach(function(o){ if(!o.tourId)o.tourId=tid; });
  });
  (S.crew||[]).forEach(function(c){
    if(!c.gewerk)c.gewerk=c.abteilung||'ohne Gewerk';
    if(c.info===undefined)c.info='';
  });
  (S.fahrten||[]).forEach(function(f){ if(!f.stadt)f.stadt=S.einst.stadt||''; });
  if(!S.textvorlagen)S.textvorlagen=demoDaten().textvorlagen;
  if(!S.einst.tourId)S.einst.tourId=tid;
  if(!S.einst.jshow)S.einst.jshow={adresse:'',schluessel:'',plattform:''};
  var js=S.einst.jshow;
  if(js.pfadTermine===undefined)js.pfadTermine='';
  if(js.pfadCrew===undefined)js.pfadCrew='';
  if(js.pfadSchreiben===undefined)js.pfadSchreiben='';
  if(js.proxy===undefined)js.proxy='';
  if(js.kopf===undefined)js.kopf='Authorization: Bearer {schluessel}';
  if(js.aktiv===undefined)js.aktiv=false;
  if(js.modus===undefined)js.modus='demo';
  if(!S.fahrer)S.fahrer=demoDaten().fahrer;
  (S.fahrer||[]).forEach(function(x){ if(!x.tourId)x.tourId=tid; });
  (S.textvorlagen||[]).forEach(function(v){ if(!v.empfaenger)v.empfaenger='crew'; });
  (S.touren||[]).forEach(function(t){ if(!t.staedteInfo)t.staedteInfo={}; });
}
function protokoll(text){
  S.protokoll.unshift({ts:new Date().toISOString(), text:text});
  if(S.protokoll.length>300)S.protokoll.length=300;
}

/* ---------- Demo-Daten ---------- */
function demoDaten(){
  /* Der Demo-Tag liegt immer in der Zukunft: vor 7 Uhr ist es heute, sonst morgen. */
  var h=(new Date().getHours()<7)?heuteISO():plusTage(heuteISO(),1), m1=plusTage(h,1);
  var crewRoh=[
    ['Marek','Ahrens','Produktion'],['Jonas','Beck','Backline'],['Silke','Brand','Catering'],
    ['Timo','Deckert','Licht'],['Nina','Falk','Audio'],['Ruben','Gerlach','Backline'],
    ['Lea','Hartmann','Produktion'],['Kai','Hoffmann','Licht'],['Mira','Jansen','LED/Video'],
    ['Ole','Kranz','Audio'],['Frida','Lang','Merchandise'],['Ben','Maurer','Rigging'],
    ['Aylin','Neumann','Catering'],['Sven','Ortmann','Bühne'],['Jule','Pfeiffer','LED/Video'],
    ['Nico','Reinert','Bühne'],['Tara','Schmitz','Merchandise'],['Luis','Steger','Rigging'],
    ['Hanna','Vogt','Produktion'],['Emil','Walther','Licht'],['Pia','Zeidler','Audio'],
    ['Dario','Cordes','Backline'],['Maja','Endres','Bühne'],['Finn','Groth','LED/Video']
  ];
  crewRoh = crewRoh.concat([
    ['Charlotte','König','Tourmanagement'],['Daniel','Treseler','Tourmanagement'],
    ['Ilja','Bertram','Band'],['Nele','Winter','Band'],['Samuel','Roth','Band'],['Toni','Kessler','Band'],
    ['Rüdiger','Palm','Fahrer'],['Petra','Simon','Fahrer']
  ]);
  var crew=crewRoh.map(function(c,i){
    return {id:'c'+(i+1), tourId:'tour-amk', vorname:c[0], nachname:c[1], gewerk:c[2],
            kuerzel:(c[0][0]+c[1][0]).toUpperCase(), info:'', telefon:''};
  });
  var fz=[
    {id:'f1', tourId:'tour-amk', stadt:'Berlin', fahrerId:'fa1', name:'Shuttle 1', vorlage:'van7', kennzeichen:'B-AM 1234', fahrer:'Rüdiger Palm',
     notiz:'Klimaanlage, Platz für 4 kleine Cases im Heck.'},

/* ---------- Aktive Tour ---------- */
function tourId(){return S.einst.tourId;}
function tour(){
  for(var i=0;i<S.touren.length;i++)if(S.touren[i].id===S.einst.tourId)return S.touren[i];
  return S.touren[0];
}
function tourName(t){t=t||tour();return t?(t.kuenstler+' \u00b7 '+t.tour+' '+t.jahr):'';}
function mFahrten(){return S.fahrten.filter(function(x){return x.tourId===tourId();});}
function mCrew(){return S.crew.filter(function(x){return x.tourId===tourId();});}
function mFahrzeuge(){return S.fahrzeuge.filter(function(x){return x.tourId===tourId();});}
function mVorlagen(){return S.tagesvorlagen.filter(function(x){return x.tourId===tourId();});}
function mTexte(stadt){
  return S.textvorlagen.filter(function(x){
    if(x.tourId!==tourId())return false;
    if(stadt===undefined)return true;
    return !x.stadt || x.stadt===stadt;
  });
}
function mFahrer(stadt){
  return S.fahrer.filter(function(x){
    return x.tourId===tourId() && (!stadt || x.stadt===stadt);
  });
}
function fahrerById(id){for(var i=0;i<S.fahrer.length;i++)if(S.fahrer[i].id===id)return S.fahrer[i];return null;}
function kurzFz(fz){
  var n=(fz&&fz.name)||'?';
  return n.replace(/^Shuttle\s*/,'Sh ').slice(0,14);
}
function fahrerName(fz){
  var f=fz&&fz.fahrerId?fahrerById(fz.fahrerId):null;
  return f?f.name:((fz&&fz.fahrer)||'noch offen');
}
function stadtInfo(stadt){
  var t=tour(); if(!t.staedteInfo)t.staedteInfo={};
  if(!t.staedteInfo[stadt])t.staedteInfo[stadt]={fahrerGruppe:'',link:'',hotel:'',venue:''};
  return t.staedteInfo[stadt];
}
function aktStadt(){
  if(ansicht.tag){
    var f=mFahrten().filter(function(x){return x.datum===ansicht.tag;})[0];
    if(f&&f.stadt)return f.stadt;
  }
  return S.einst.stadt||'';
}
function gewerkVon(c){return (c&&(c.gewerk||c.abteilung))||'ohne Gewerk';}

/* ---------- Nachschlagen ---------- */
function crewById(id){for(var i=0;i<S.crew.length;i++)if(S.crew[i].id===id)return S.crew[i];return null;}
function fzById(id){for(var i=0;i<S.fahrzeuge.length;i++)if(S.fahrzeuge[i].id===id)return S.fahrzeuge[i];return null;}
function fahrtById(id){for(var i=0;i<S.fahrten.length;i++)if(S.fahrten[i].id===id)return S.fahrten[i];return null;}
function name(c){return c?(c.nachname+' '+c.vorname):'—';}
function nameKurz(c){return c?(c.vorname+' '+c.nachname[0]+'.'):'—';}
function istAdmin(){return S.einst.rolle==='admin';}
function ich(){return crewById(S.einst.ich);}

function vorlageVon(sh){var f=fzById(sh.fahrzeugId);return f?f.vorlage:'van7';}
function buchbareSitze(sh){return VANS.buchbar(vorlageVon(sh));}
function freiCount(sh){
  var b=buchbareSitze(sh), frei=0;
  b.forEach(function(s){
    if((sh.gesperrt||[]).indexOf(s.id)>=0)return;
    if(!sh.plaetze[s.id])frei++;
  });
  return frei;
}
function belegtCount(sh){
  var n=0; for(var k in sh.plaetze) if(sh.plaetze.hasOwnProperty(k))n++;
  return n;
}
function kapazitaet(sh){return buchbareSitze(sh).length-(sh.gesperrt||[]).length;}
function fahrtFrei(f){var n=0;f.shuttles.forEach(function(s){n+=freiCount(s);});return n;}
function fahrtKap(f){var n=0;f.shuttles.forEach(function(s){n+=kapazitaet(s);});return n;}
function offeneAnfragen(){
  var n=0;
  mFahrten().forEach(function(f){f.shuttles.forEach(function(sh){
    for(var k in sh.plaetze) if(sh.plaetze[k].status==='angefragt')n++;
  });});
  return n;
}
function meinPlatz(f, crewId){
  for(var i=0;i<f.shuttles.length;i++){
    var sh=f.shuttles[i];
    for(var k in sh.plaetze) if(sh.plaetze[k].crewId===crewId) return {sh:sh, sitz:k, b:sh.plaetze[k]};
  }
  return null;
}
function buchbarBis(f){
  var m=minutenBis(f)-(S.einst.buchungsschluss||0);
  return m>0;
}
function fahrtZu(f){
  return f.status==='geschlossen' || !buchbarBis(f);
}

/* ---------- Toast / Dialog ---------- */
var toastT=null;
function toast(txt){
  var alt=document.querySelector('.toast'); if(alt)alt.remove();
  var t=el('div','toast',txt); document.body.appendChild(t);
  clearTimeout(toastT); toastT=setTimeout(function(){t.remove();},2600);
}
function dialog(titel, inhaltFn, knoepfe){
  var ovl=el('div','ovl'), d=el('div','dlg');
  d.appendChild(el('h2',null,titel));
  var body=el('div'); d.appendChild(body);
  if(inhaltFn)inhaltFn(body);
  var zeile=el('div','dlgbtns');
  function zu(){ovl.remove();}
  (knoepfe||[{text:'Schließen'}]).forEach(function(k){
    var b=el('button','btn'+(k.art?' '+k.art:''),k.text);
    b.onclick=function(){ if(!k.fn||k.fn(body)!==false) zu(); };
    zeile.appendChild(b);
  });
  d.appendChild(zeile);
  ovl.appendChild(d); document.body.appendChild(ovl);
  ovl.addEventListener('click',function(e){if(e.target===ovl)zu();});
  return {zu:zu, body:body};
}
function frage(titel, text, jaText, jaFn, art){
  dialog(titel,function(b){b.appendChild(el('p',null,text));},
    [{text:'Abbrechen'},{text:jaText,art:art||'pri',fn:function(){jaFn();}}]);
}

/* ---------- Kopieren ---------- */
function kopieren(text, meldung){
  function fallback(){
    var ta=el('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy'); toast(meldung||'Kopiert.');}
    catch(e){toast('Kopieren nicht möglich — bitte Text markieren.');}
    ta.remove();
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){toast(meldung||'Kopiert.');},fallback);
  } else fallback();
}

function zeichneFahrten(m){
  var tage={};
  mFahrten().slice().sort(function(a,b){
    return (a.datum+a.zeit)<(b.datum+b.zeit)?-1:1;
  }).forEach(function(f){ (tage[f.datum]=tage[f.datum]||[]).push(f); });

  var datumsListe=Object.keys(tage).sort();
  if(!datumsListe.length){
    m.appendChild(el('div','leer','Noch keine Fahrten angelegt.'));
  }

  if(istAdmin()){
    var k=el('div','sec'), z=el('div','btnzeile');
    var b1=el('button','btn pri','Neue Fahrt anlegen'); b1.onclick=function(){fahrtBearbeiten(null);};
    var b2=el('button','btn','Tag aus Vorlage erzeugen'); b2.onclick=vorlageAnwendenDialog;
    z.appendChild(b1); z.appendChild(b2); k.appendChild(z); m.appendChild(k);
  }

  datumsListe.forEach(function(dat){
    var kopf=el('div','sechead');
    kopf.appendChild(el('h2',null,datumLang(dat)+(dat===heuteISO()?' · heute':'')));
    var frei=0,kap=0; tage[dat].forEach(function(f){frei+=fahrtFrei(f);kap+=fahrtKap(f);});
    kopf.appendChild(el('span',null,tage[dat].length+' Abfahrten · '+frei+' von '+kap+' Plätzen frei'));
    m.appendChild(kopf);

    var sec=el('div','sec');
    tage[dat].forEach(function(f){ sec.appendChild(fahrtKarte(f)); });
    m.appendChild(sec);
  });
}

function fahrtKarte(f){
  var c=el('div','card'+(f.status==='entwurf'?'':' hl'));
  var kopf=el('div','row');
  var t=el('div','grow stack');
  var z1=el('div','row');
  var zeit=el('span',null,f.zeit+' Uhr'); zeit.style.fontFamily='var(--disp)';
  zeit.style.fontWeight='700'; zeit.style.fontSize='20px'; zeit.style.color='var(--tape-sig)';
  z1.appendChild(zeit);
  z1.appendChild(el('span',null,f.richtung));
  if(f.status==='entwurf') z1.appendChild(el('span','badge b-plan','Entwurf'));
  else if(fahrtZu(f)) z1.appendChild(el('span','badge b-zu','Buchung zu'));
  else z1.appendChild(el('span','badge b-ok','Buchung offen'));
  var rest=el('span','badge b-plan',restText(f)); z1.appendChild(rest);
  t.appendChild(z1);
  t.appendChild(el('div','meta','Ab '+f.von+' → '+f.nach));
  var frei=fahrtFrei(f), kap=fahrtKap(f);
  t.appendChild(el('div','meta',(kap-frei)+' von '+kap+' Plätzen belegt · '+frei+' frei'));
  if(f.hinweis) t.appendChild(el('div','meta','„'+f.hinweis+'"'));
  kopf.appendChild(t);
  c.appendChild(kopf);

  /* Mini-Vorschau der Shuttles */
  var vor=el('div','row'); vor.style.marginTop='10px';
  f.shuttles.forEach(function(sh){
    var fz=fzById(sh.fahrzeugId); if(!fz)return;
    var box=el('div'); box.style.width='110px'; box.style.textAlign='center';
    var svg=VANS.zeichneVan(fz.vorlage,{ohneKlick:true,zustand:function(sid,def){
      return sitzZustand(sh,sid,def,true);
    }});
    svg.classList.add('klein');
    box.appendChild(svg);
    var lab=el('div','meta',fz.name); lab.style.fontSize='12px'; box.appendChild(lab);
    var lab2=el('div','meta',freiCount(sh)+' frei'); lab2.style.fontSize='12px';
    lab2.style.color=freiCount(sh)?'var(--ok-ink)':'var(--now-ink)'; box.appendChild(lab2);
    vor.appendChild(box);
  });
  c.appendChild(vor);

  var mp=meinPlatz(f,S.einst.ich);
  if(mp){
    var hin=el('div','hint tape');
    hin.textContent='Dein Platz: '+(fzById(mp.sh.fahrzeugId)||{}).name+
      ' · '+(mp.b.status==='bestaetigt'?'bestätigt':'noch nicht bestätigt');
    hin.style.margin='10px 0 0'; c.appendChild(hin);
  }

  var btn=el('div','btnzeile'); btn.style.marginTop='11px';
  var b=el('button','btn pri','Sitzplan öffnen');
  b.onclick=function(){ansicht.fahrtId=f.id;zeichne();};
  btn.appendChild(b);
  if(istAdmin()){
    var b2=el('button','btn klein','Bearbeiten'); b2.onclick=function(){fahrtBearbeiten(f);};
    var b3=el('button','btn klein','WhatsApp-Text'); b3.onclick=function(){whatsappDialog(f);};
    btn.appendChild(b2); btn.appendChild(b3);
  }
  c.appendChild(btn);
  return c;
}

/* ==========================================================
   2) Fahrt-Detail mit Sitzplänen
   ========================================================== */
function sitzZustand(sh, sid, def, mini){
  var fz=fzById(sh.fahrzeugId)||{};
  if(def.typ==='fahrer') return {klasse:'fahrer', titel:'Fahrer: '+fahrerName(fz), sub:''};
  if((sh.gesperrt||[]).indexOf(sid)>=0)
    return {klasse:'gesperrt', text:'▩', sub:mini?'':'Gepäck', titel:'Für Gepäck gesperrt'};
  var b=sh.plaetze[sid];
  if(!b){
    var offen=!fahrtZu(aktuelleFahrt(sh));
    return {klasse:'frei', text:mini?'':'+', sub:mini?'':'frei',
      titel:offen?'Freier Platz — zum Buchen anklicken':'Freier Platz, Buchung ist geschlossen',
      klickbar:offen||istAdmin()};
  }
  var c=crewById(b.crewId);
  var eigen=(b.crewId===S.einst.ich);
  return {
    klasse:(b.status==='bestaetigt'?'bestaetigt':'angefragt')+(eigen?' ich':''),
    text:mini?'':(c?c.kuerzel:'??'),
    sub:mini?'':(c?c.vorname:''),
    titel:(c?name(c):'?')+' · '+(b.status==='bestaetigt'?'bestätigt':'angefragt, wartet auf Freigabe'),
    klickbar:istAdmin()||eigen
  };
}
function aktuelleFahrt(sh){
  for(var i=0;i<S.fahrten.length;i++){
    var f=S.fahrten[i];
    for(var j=0;j<f.shuttles.length;j++) if(f.shuttles[j]===sh) return f;
  }
  return S.fahrten[0];
}

function zeichneFahrtDetail(m){
  var f=fahrtById(ansicht.fahrtId);
  if(!f){ansicht.fahrtId=null;zeichne();return;}

  var kopf=el('div','sec');
  var zur=el('button','btn klein','← Zurück zu den Fahrten');
  zur.onclick=function(){ansicht.fahrtId=null;zeichne();};
  kopf.appendChild(zur);
  m.appendChild(kopf);

  var kk=el('div','sechead');
  kk.appendChild(el('h2',null,datumLang(f.datum)+' · '+f.zeit+' Uhr · '+f.richtung));
  kk.appendChild(el('span',null,restText(f)));
  m.appendChild(kk);

  var info=el('div','sec');
  var ic=el('div','card');
  ic.appendChild(el('div',null,'Treffpunkt: '+f.von));
  ic.appendChild(el('div','meta','Ziel: '+f.nach));
  if(f.hinweis) ic.appendChild(el('div','meta','Hinweis: '+f.hinweis));
  var st=el('div','row'); st.style.marginTop='8px';
  if(fahrtZu(f)) st.appendChild(el('span','badge b-zu','Buchung geschlossen'));
  else st.appendChild(el('span','badge b-ok','Buchung offen bis '+S.einst.buchungsschluss+' Min vor Abfahrt'));
  var mp=meinPlatz(f,S.einst.ich);
  if(mp) st.appendChild(el('span','badge b-tape','Dein Platz: '+(fzById(mp.sh.fahrzeugId)||{}).name));
  ic.appendChild(st);
  info.appendChild(ic);
  m.appendChild(info);

  if(istAdmin()){
    var ab=el('div','sec'), z=el('div','btnzeile');
    var b1=el('button','btn klein','Shuttle hinzufügen'); b1.onclick=function(){shuttleHinzufuegen(f);};
    var b2=el('button','btn klein','Alle Anfragen bestätigen'); b2.onclick=function(){alleBestaetigen(f);};
    var b3=el('button','btn klein','WhatsApp-Text'); b3.onclick=function(){whatsappDialog(f);};
    var b4=el('button','btn klein',fahrtZu(f)?'Buchung wieder öffnen':'Buchung schließen');
    b4.onclick=function(){f.status=(f.status==='geschlossen'?'offen':'geschlossen');
      protokoll('Fahrt '+f.zeit+' '+(f.status==='geschlossen'?'geschlossen':'geöffnet'));speichern();zeichne();};
    var b5=el('button','btn klein','Fahrerliste drucken'); b5.onclick=function(){fahrerliste(f);};
    [b1,b2,b3,b4,b5].forEach(function(b){z.appendChild(b);});
    ab.appendChild(z); m.appendChild(ab);
  }

  var wrap=el('div','sec'), grid=el('div','shuttlegrid');
  f.shuttles.forEach(function(sh){ grid.appendChild(shuttleKarte(f,sh)); });
  wrap.appendChild(grid); m.appendChild(wrap);

  var lg=el('div','sec legende');
  [['','frei'],['a','angefragt'],['b','bestätigt'],['g','Gepäck / gesperrt']].forEach(function(p){
    var s=el('span'); var i=el('i','lp'+(p[0]?' '+p[0]:'')); i.style.display='inline-block';
    s.appendChild(i); s.appendChild(el('span',null,p[1])); lg.appendChild(s);
  });
  m.appendChild(lg);
}

function shuttleKarte(f, sh){
  var fz=fzById(sh.fahrzeugId)||{name:'Unbekannt',vorlage:'van7'};
  var vl=VANS.VORLAGEN[fz.vorlage]||{};
  var c=el('div','shuttlecard');
  var h=el('h3',null,fz.name);
  h.appendChild(el('span','kfz',fz.kennzeichen||'ohne Kennzeichen'));
  c.appendChild(h);
  c.appendChild(el('div','meta',(vl.name||'')+' · Fahrer: '+fahrerName(fz)+
    (sh.zeit?' · Abfahrt abweichend '+sh.zeit+' Uhr':'')));
  if(fz.notiz) c.appendChild(el('div','meta',fz.notiz));

  var kap=kapazitaet(sh), belegt=belegtCount(sh);
  var bal=el('div','balken'); var i=el('i');
  i.style.width=(kap?Math.round(belegt/kap*100):0)+'%';
  if(belegt>=kap)i.className='voll';
  bal.appendChild(i); c.appendChild(bal);
  c.appendChild(el('div','meta',belegt+' von '+kap+' Plätzen belegt · '+freiCount(sh)+' frei'));

  var vw=el('div','vanwrap');
  var svg=VANS.zeichneVan(fz.vorlage,{
    zustand:function(sid,def){return sitzZustand(sh,sid,def,false);},
    klick:function(sid,def){sitzKlick(f,sh,sid,def);}
  });
  vw.appendChild(svg); c.appendChild(vw);

  if((sh.warteliste||[]).length){
    var wl=el('div','hint warn');
    wl.style.margin='10px 0 0';
    wl.textContent='Warteliste: '+sh.warteliste.map(function(id){return nameKurz(crewById(id));}).join(', ');
    c.appendChild(wl);
  }

  var bz=el('div','btnzeile'); bz.style.marginTop='10px';
  if(!istAdmin() && freiCount(sh)===0 && !meinPlatz(f,S.einst.ich)){
    var bw=el('button','btn klein','Auf die Warteliste');
    bw.onclick=function(){aufWarteliste(f,sh);};
    bz.appendChild(bw);
  }
  if(istAdmin()){
    var bb=el('button','btn klein','Bild für WhatsApp');
    bb.onclick=function(){bildExport(f,sh,svg);};
    bz.appendChild(bb);
    var br=el('button','btn klein','Shuttle entfernen');
    br.onclick=function(){
      frage('Shuttle entfernen','„'+fz.name+'" aus dieser Fahrt entfernen? Gebuchte Plätze gehen verloren.',
        'Entfernen',function(){
          f.shuttles=f.shuttles.filter(function(x){return x!==sh;});
          protokoll('Shuttle '+fz.name+' aus Fahrt '+f.zeit+' entfernt'); speichern(); zeichne();
        },'warn');
    };
    bz.appendChild(br);
  }
  c.appendChild(bz);
  return c;
}

/* ---------- Klick auf einen Platz ---------- */
function sitzKlick(f, sh, sid, def){
  if(def.typ==='fahrer'){toast('Das ist der Fahrerplatz.');return;}
  var b=sh.plaetze[sid];
  var gesperrt=(sh.gesperrt||[]).indexOf(sid)>=0;

  if(istAdmin()){ adminSitzMenue(f,sh,sid,b,gesperrt); return; }

  /* Crew-Ansicht */
  if(gesperrt){toast('Dieser Platz ist für Gepäck gesperrt.');return;}
  if(b){
    if(b.crewId===S.einst.ich){
      frage('Platz freigeben','Möchtest du deinen Platz wieder freigeben?','Platz freigeben',
        function(){ platzFreigeben(f,sh,sid); },'warn');
    } else {
      toast('Platz ist von '+nameKurz(crewById(b.crewId))+' belegt.');
    }
    return;
  }
  if(fahrtZu(f)){toast('Die Buchung für diese Fahrt ist geschlossen.');return;}
  var vorher=meinPlatz(f,S.einst.ich);
  var txt='Einen Platz in „'+(fzById(sh.fahrzeugId)||{}).name+'" für '+name(ich())+' anfragen?';
  if(vorher) txt+='\n\nDein bisheriger Platz in dieser Fahrt wird dabei frei.';
  dialog('Platz reservieren',function(bd){
    bd.appendChild(el('p',null,txt));
    bd.appendChild(el('p',null,'Die Freigabe macht das Tourmanagement. Du siehst den Platz danach grün.'));
  },[{text:'Abbrechen'},{text:'Platz anfragen',art:'pri',fn:function(){
    if(vorher) delete vorher.sh.plaetze[vorher.sitz];
    sh.plaetze[sid]={crewId:S.einst.ich, status:S.einst.autoBestaetigen?'bestaetigt':'angefragt',
      ts:new Date().toISOString()};
    sh.warteliste=(sh.warteliste||[]).filter(function(x){return x!==S.einst.ich;});
    protokoll(name(ich())+' hat einen Platz in '+(fzById(sh.fahrzeugId)||{}).name+' angefragt');
    speichern(); zeichne();
    toast(S.einst.autoBestaetigen?'Platz gebucht.':'Anfrage abgeschickt — wartet auf Freigabe.');
  }}]);
}

function adminSitzMenue(f, sh, sid, b, gesperrt){
  var fz=fzById(sh.fahrzeugId)||{};
  dialog('Platz in '+fz.name,function(bd){
    if(b){
      bd.appendChild(el('p',null,'Belegt von '+name(crewById(b.crewId))+
        ' · '+(b.status==='bestaetigt'?'bestätigt':'angefragt')));
    } else if(gesperrt){
      bd.appendChild(el('p',null,'Dieser Platz ist für Gepäck gesperrt.'));
    } else {
      bd.appendChild(el('p',null,'Platz ist frei. Du kannst direkt jemanden eintragen.'));
      var lab=el('label','feld','Crew-Mitglied'); bd.appendChild(lab);
      var sel=el('select'); sel.id='dlgCrew';
      sel.appendChild(el('option',null,'— bitte wählen —'));
      mCrew().slice().sort(function(a,b2){return name(a)<name(b2)?-1:1;}).forEach(function(c){
        var o=el('option',null,name(c)+' · '+gewerkVon(c)); o.value=c.id; sel.appendChild(o);
      });
      bd.appendChild(sel);
    }
  }, (function(){
    var k=[{text:'Schließen'}];
    if(b){
      if(b.status==='angefragt')
        k.push({text:'Bestätigen',art:'ok',fn:function(){
          b.status='bestaetigt'; protokoll('Platz für '+name(crewById(b.crewId))+' bestätigt');
          speichern();zeichne();toast('Platz bestätigt.');}});
      k.push({text:'Platz freigeben',art:'warn',fn:function(){platzFreigeben(f,sh,sid);}});
    } else if(gesperrt){
      k.push({text:'Sperre aufheben',fn:function(){
        sh.gesperrt=sh.gesperrt.filter(function(x){return x!==sid;});speichern();zeichne();}});
    } else {
      k.push({text:'Für Gepäck sperren',fn:function(){
        sh.gesperrt=(sh.gesperrt||[]).concat([sid]);
        protokoll('Ein Platz in '+fz.name+' für Gepäck gesperrt');speichern();zeichne();}});
      k.push({text:'Eintragen',art:'pri',fn:function(bd){
        var sel=bd.querySelector('#dlgCrew');
        if(!sel||!sel.value){toast('Bitte zuerst jemanden auswählen.');return false;}
        var vorher=meinPlatzVon(f,sel.value);
        if(vorher) delete vorher.sh.plaetze[vorher.sitz];
        sh.plaetze[sid]={crewId:sel.value,status:'bestaetigt',ts:new Date().toISOString()};
        protokoll(name(crewById(sel.value))+' in '+fz.name+' eingetragen');
        speichern();zeichne();toast('Eingetragen und bestätigt.');
      }});
    }
    return k;
  })());
}
function meinPlatzVon(f, crewId){return meinPlatz(f,crewId);}

function platzFreigeben(f, sh, sid){
  var b=sh.plaetze[sid]; if(!b)return;
  var wer=name(crewById(b.crewId));
  delete sh.plaetze[sid];
  protokoll('Platz von '+wer+' freigegeben');
  /* Warteliste rückt nach */
  if((sh.warteliste||[]).length){
    var next=sh.warteliste.shift();
    sh.plaetze[sid]={crewId:next,status:'angefragt',ts:new Date().toISOString()};
    protokoll(name(crewById(next))+' ist von der Warteliste nachgerückt');
    toast('Platz frei — '+nameKurz(crewById(next))+' ist von der Warteliste nachgerückt.');
  } else toast('Platz ist wieder frei.');
  speichern(); zeichne();
}

function aufWarteliste(f, sh){
  sh.warteliste=sh.warteliste||[];
  if(sh.warteliste.indexOf(S.einst.ich)>=0){toast('Du stehst schon auf der Warteliste.');return;}
  sh.warteliste.push(S.einst.ich);
  protokoll(name(ich())+' auf Warteliste');
  speichern(); zeichne(); toast('Du stehst auf der Warteliste — wir sagen Bescheid.');
}

function alleBestaetigen(f){
  var n=0;
  f.shuttles.forEach(function(sh){
    for(var k in sh.plaetze) if(sh.plaetze[k].status==='angefragt'){sh.plaetze[k].status='bestaetigt';n++;}
  });
  if(!n){toast('Es gibt keine offenen Anfragen.');return;}
  protokoll(n+' Anfragen für die Fahrt '+f.zeit+' bestätigt');
  speichern(); zeichne(); toast(n+' Anfragen bestätigt.');
}

function shuttleHinzufuegen(f){
  dialog('Shuttle hinzufügen',function(bd){
    bd.appendChild(el('label','feld','Fahrzeug'));
    var sel=el('select'); sel.id='dlgFz';
    mFahrzeuge().forEach(function(fz){
      var vl=VANS.VORLAGEN[fz.vorlage]||{};
      var o=el('option',null,fz.name+' · '+(vl.kurz||'')+' · '+fz.kennzeichen); o.value=fz.id;
      sel.appendChild(o);
    });
    bd.appendChild(sel);
    bd.appendChild(el('label','feld','Abweichende Abfahrtszeit (leer = wie die Fahrt)'));
    var t=el('input'); t.type='time'; t.id='dlgZeit'; bd.appendChild(t);
  },[{text:'Abbrechen'},{text:'Hinzufügen',art:'pri',fn:function(bd){
    var fid=bd.querySelector('#dlgFz').value;
    f.shuttles.push({id:uid('s'), fahrzeugId:fid, zeit:bd.querySelector('#dlgZeit').value||'',
      gesperrt:[], warteliste:[], plaetze:{}});
    protokoll('Shuttle '+(fzById(fid)||{}).name+' zur Fahrt '+f.zeit+' hinzugefügt');
    speichern(); zeichne();
  }}]);
}

/* ---------- Fahrt anlegen / bearbeiten ---------- */
function fahrtBearbeiten(f){
  var neu=!f;
  var d={datum:f?f.datum:heuteISO(), zeit:f?f.zeit:'08:30',
    richtung:f?f.richtung:'Hotel ➜ Venue', von:f?f.von:'Hotellobby',
    nach:f?f.nach:'Venue · Crew-Eingang', hinweis:f?f.hinweis:'', status:f?f.status:'offen'};
  dialog(neu?'Neue Fahrt':'Fahrt bearbeiten',function(bd){
    function feld(id,lab,typ,wert){
      bd.appendChild(el('label','feld',lab));
      var i=el('input'); i.type=typ||'text'; i.id=id; i.value=wert||''; bd.appendChild(i); return i;
    }
    var z=el('div','fzeile');
    var d1=el('div'); d1.appendChild(el('label','feld','Datum'));
    var i1=el('input'); i1.type='date'; i1.id='fDatum'; i1.value=d.datum; d1.appendChild(i1);
    var d2=el('div'); d2.appendChild(el('label','feld','Abfahrt'));
    var i2=el('input'); i2.type='time'; i2.id='fZeit'; i2.value=d.zeit; d2.appendChild(i2);
    z.appendChild(d1); z.appendChild(d2); bd.appendChild(z);

    bd.appendChild(el('label','feld','Richtung'));
    var sel=el('select'); sel.id='fRicht';
    ['Hotel ➜ Venue','Venue ➜ Hotel','Hotel ➜ Bahnhof','Bahnhof ➜ Hotel','Hotel ➜ Flughafen',
     'Flughafen ➜ Hotel','Sonderfahrt'].forEach(function(r){
      var o=el('option',null,r); o.value=r; if(r===d.richtung)o.selected=true; sel.appendChild(o);
    });
    bd.appendChild(sel);
    feld('fVon','Treffpunkt','text',d.von);
    feld('fNach','Ziel','text',d.nach);
    bd.appendChild(el('label','feld','Hinweis für die Crew'));
    var ta=el('textarea'); ta.id='fHin'; ta.value=d.hinweis; ta.style.minHeight='60px'; bd.appendChild(ta);
    bd.appendChild(el('label','feld','Status'));
    var s2=el('select'); s2.id='fStatus';
    [['entwurf','Entwurf (Crew sieht die Fahrt, kann aber nicht buchen)'],
     ['offen','Offen (Crew kann buchen)'],
     ['geschlossen','Geschlossen (keine Buchung mehr)']].forEach(function(p){
      var o=el('option',null,p[1]); o.value=p[0]; if(p[0]===d.status)o.selected=true; s2.appendChild(o);
    });
    bd.appendChild(s2);
  },[{text:'Abbrechen'},
     (f?{text:'Fahrt löschen',art:'warn',fn:function(){
       S.fahrten=S.fahrten.filter(function(x){return x!==f;});
       protokoll('Fahrt '+f.datum+' '+f.zeit+' gelöscht');
       speichern();ansicht.fahrtId=null;zeichne();}}:{text:' ',fn:function(){return true;}}),
     {text:'Speichern',art:'pri',fn:function(bd){
       var neuF=f||{id:uid('t'), tourId:tourId(), stadt:S.einst.stadt, shuttles:[]};
       neuF.datum=bd.querySelector('#fDatum').value||heuteISO();
       neuF.zeit=bd.querySelector('#fZeit').value||'08:00';
       neuF.richtung=bd.querySelector('#fRicht').value;
       neuF.von=bd.querySelector('#fVon').value;
       neuF.nach=bd.querySelector('#fNach').value;
       neuF.hinweis=bd.querySelector('#fHin').value;
       neuF.status=bd.querySelector('#fStatus').value;
       if(!f){S.fahrten.push(neuF); protokoll('Neue Fahrt '+neuF.datum+' '+neuF.zeit+' angelegt');}
       else protokoll('Fahrt '+neuF.datum+' '+neuF.zeit+' geändert');
       speichern(); zeichne();
       if(!f){ansicht.fahrtId=neuF.id;zeichne();}
     }}]);
}

/* ---------- Fahrerliste ---------- */

    'h2{font-size:15px;margin:18px 0 4px}table{border-collapse:collapse;width:100%;font-size:13px}'+
    'td,th{border:1px solid #999;padding:5px 7px;text-align:left}th{background:#eee}'+
    '.m{color:#444;font-size:13px}</style></head><body>';

  h+='<div class="m">'+f.richtung+' · Treffpunkt '+f.von+' · Ziel '+f.nach+'</div>';

      h+='<tr><td>'+nr+'</td><td>'+(b?name(crewById(b.crewId)):(g?'— Gepäck —':'frei'))+'</td><td>'+

  });
  h+='<p class="m">Gedruckt am '+datumLang(heuteISO())+'</p></body></html>';
  w.document.write(h); w.document.close();
}

/* ---------- Bild-Export für WhatsApp ---------- */
function bildExport(f, sh, svgQuelle){
  var fz=fzById(sh.fahrzeugId)||{};
  var svg=svgQuelle.cloneNode(true);
  /* Farben fest einsetzen, damit das Bild ohne Formularvorlage stimmt */
  var hell=(S.einst.theme==='light');
  var css='.seatbox{stroke-width:2}.seattext{font-family:Arial;font-weight:700;font-size:19px;text-anchor:middle}'+
    '.seatsub{font-family:Arial;font-size:10px;text-anchor:middle}';
  var st=document.createElementNS('http://www.w3.org/2000/svg','style');
  st.textContent=css; svg.insertBefore(st,svg.firstChild);
  /* Variablen auflösen */
  var werte={'--vanbody':hell?'#FFFFFF':'#3A404A','--vanline':hell?'#7E838D':'#828997',
    '--vanglas':hell?'#C3CFDF':'#46505F','--frei-bg':hell?'#F6F6F6':'#23262C',
    '--frei-line':hell?'#8A8F99':'#5A5F6B','--ink':hell?'#000':'#FFF','--dim':hell?'#000':'#FFF',
    '--vaninnen':hell?'#E9EBEE':'#1C1F24','--vanrad':hell?'#2F323A':'#0C0D10',
    '--vanhaube':hell?'#F2F3F5':'#333844','--vanlicht':'#FFE9A8','--vanruecklicht':hell?'#D6534A':'#C2453B'};
  var alle=svg.querySelectorAll('*');
  for(var i=0;i<alle.length;i++){
    var n=alle[i];
    ['fill','stroke'].forEach(function(at){
      var v=n.getAttribute(at);
      if(v&&v.indexOf('var(')===0){
        var k=v.slice(4,-1).trim();
        if(werte[k])n.setAttribute(at,werte[k]);
      }
    });
    var kl=n.getAttribute('class')||'';
    if(kl.indexOf('seatbox')>=0){
      var p=n.parentNode.getAttribute('class')||'';
      if(p.indexOf('bestaetigt')>=0){n.setAttribute('fill',hell?'#DDF0D9':'#22401F');n.setAttribute('stroke','#64A85C');}
      else if(p.indexOf('angefragt')>=0){n.setAttribute('fill',hell?'#FFF0C2':'#4A3D12');n.setAttribute('stroke','#FFD23F');
        n.setAttribute('stroke-dasharray','5 4');}
      else if(p.indexOf('frei')>=0){n.setAttribute('fill',werte['--frei-bg']);n.setAttribute('stroke',werte['--frei-line']);
        n.setAttribute('stroke-dasharray','5 4');}
      else if(p.indexOf('gesperrt')>=0){n.setAttribute('fill',hell?'#E6E6E6':'#26282E');n.setAttribute('stroke',hell?'#C4C4C4':'#33363E');}
      else if(p.indexOf('fahrer')>=0){n.setAttribute('fill',hell?'#E9EAEE':'#1A1C21');n.setAttribute('stroke',hell?'#9A9EA8':'#4A4E58');}
      else {n.setAttribute('fill',werte['--frei-bg']);n.setAttribute('stroke',werte['--frei-line']);}
    }
    if(kl.indexOf('seattext')>=0||kl.indexOf('seatsub')>=0)n.setAttribute('fill',werte['--ink']);
    if(kl.indexOf('seatlehne')>=0)n.setAttribute('fill',werte['--frei-line']);
    if(kl.indexOf('lenkrad')>=0)n.setAttribute('stroke',werte['--vanline']);
  }
  var vb=(svg.getAttribute('viewBox')||'0 0 300 400').split(' ');
  var bw=parseFloat(vb[2]), bh=parseFloat(vb[3]);
  var kopfH=64, fussH=34, sk=2;
  var cv=document.createElement('canvas');
  cv.width=Math.round(bw*sk); cv.height=Math.round((bh+kopfH+fussH)*sk);
  var ctx=cv.getContext('2d');
  ctx.fillStyle=hell?'#FFFFFF':'#17181C'; ctx.fillRect(0,0,cv.width,cv.height);
  var xml=new XMLSerializer().serializeToString(svg);
  var img=new Image();
  img.onload=function(){
    ctx.drawImage(img,0,kopfH*sk,bw*sk,bh*sk);
    ctx.fillStyle=hell?'#141518':'#FFD23F';
    ctx.font='700 '+(19*sk)+'px Arial';
    ctx.textAlign='center';
    ctx.fillText(fz.name+' · '+(fz.kennzeichen||''), cv.width/2, 26*sk);
    ctx.fillStyle=hell?'#000':'#FFF';
    ctx.font=(13*sk)+'px Arial';
    ctx.fillText(datumKurz(f.datum)+' · '+f.zeit+' Uhr · '+f.richtung, cv.width/2, 48*sk);
    ctx.fillText(freiCount(sh)+' von '+kapazitaet(sh)+' Plätzen frei',
      cv.width/2, (bh+kopfH+21)*sk);
    var url=cv.toDataURL('image/png');
    dialog('Bild für WhatsApp',function(bd){
      bd.appendChild(el('p',null,'Rechtsklick → Bild kopieren, oder herunterladen und in der Gruppe teilen.'));
      var im=el('img'); im.src=url; im.style.width='100%'; im.style.maxWidth='320px';
      im.style.display='block'; im.style.margin='10px auto'; bd.appendChild(im);
      var a=el('a',null,'Bild herunterladen');
      a.href=url; a.download='Shuttle_'+f.datum+'_'+f.zeit.replace(':','')+'_'+fz.name.replace(/\s+/g,'_')+'.png';
      a.style.color='var(--tape-sig)'; a.style.display='block'; a.style.textAlign='center';
      bd.appendChild(a);
    },[{text:'Schließen'}]);
  };
  img.onerror=function(){toast('Bild konnte nicht erzeugt werden.');};
  img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(xml)));
}

function zeichneAnfragen(m){
  var offen=[];
  mFahrten().forEach(function(f){f.shuttles.forEach(function(sh){
    for(var k in sh.plaetze) if(sh.plaetze[k].status==='angefragt')
      offen.push({f:f,sh:sh,sitz:k,b:sh.plaetze[k]});
  });});

  var kopf=el('div','sechead');
  kopf.appendChild(el('h2',null,'Offene Anfragen'));
  kopf.appendChild(el('span',null,offen.length+' zu bearbeiten'));
  m.appendChild(kopf);

  if(!offen.length){
    var s=el('div','sec'); var c=el('div','card');
    c.appendChild(el('div','leer','Alles bestätigt — es wartet niemand auf eine Freigabe.'));
    s.appendChild(c); m.appendChild(s);
  } else {
    var sec=el('div','sec');
    offen.sort(function(a,b){return (a.f.datum+a.f.zeit)<(b.f.datum+b.f.zeit)?-1:1;});
    offen.forEach(function(o){
      var c=el('div','card');

      t.appendChild(el('div',null,name(crewById(o.b.crewId))+' · '+

      t.appendChild(el('div','meta',datumKurz(o.f.datum)+' · '+o.f.zeit+' Uhr · '+o.f.richtung));
      t.appendChild(el('div','meta',(fzById(o.sh.fahrzeugId)||{}).name+' · '+
        ((fzById(o.sh.fahrzeugId)||{}).kennzeichen||'')));
      r.appendChild(t);
      var bz=el('div','btnzeile');
      var b1=el('button','btn ok klein','Bestätigen');
      b1.onclick=function(){o.b.status='bestaetigt';
        protokoll('Platz für '+name(crewById(o.b.crewId))+' bestätigt');
        speichern();zeichne();};
      var b2=el('button','btn klein','Ablehnen');
      b2.onclick=function(){platzFreigeben(o.f,o.sh,o.sitz);};
      bz.appendChild(b1); bz.appendChild(b2);
      r.appendChild(bz);
      c.appendChild(r);
      sec.appendChild(c);
    });
    var alles=el('div','sec');
    var ba=el('button','btn pri','Alle '+offen.length+' Anfragen bestätigen');
    ba.onclick=function(){
      offen.forEach(function(o){o.b.status='bestaetigt';});
      protokoll(offen.length+' Anfragen gesammelt bestätigt');
      speichern();zeichne();toast('Alle Anfragen bestätigt.');
    };
    alles.appendChild(ba); m.appendChild(alles);
    m.appendChild(sec);
  }

  /* Protokoll */
  var pk=el('div','sechead'); pk.appendChild(el('h2',null,'Was zuletzt passiert ist'));
  m.appendChild(pk);
  var ps=el('div','sec'), pc=el('div','card');
  if(!S.protokoll.length) pc.appendChild(el('div','leer','Noch nichts passiert.'));
  S.protokoll.slice(0,14).forEach(function(p){
    var d=new Date(p.ts);
    var z=el('div','meta',pad(d.getHours())+':'+pad(d.getMinutes())+' · '+p.text);
    pc.appendChild(z);
  });
  ps.appendChild(pc); m.appendChild(ps);
}

   ========================================================== */
function aufDoppel(node, fn){
  node.addEventListener('dblclick', function(e){ e.preventDefault(); fn(e); });
  var letzte=0;
  node.addEventListener('touchend', function(e){
    var t=Date.now();
    if(t-letzte<430){ e.preventDefault(); fn(e); letzte=0; } else letzte=t;
  });
}
function aufKontext(node, fn){
  node.addEventListener('contextmenu', function(e){ e.preventDefault(); fn(e); });
  var timer=null;
  node.addEventListener('touchstart', function(e){
    timer=setTimeout(function(){ fn(e); }, 620);
  }, {passive:true});
  ['touchend','touchmove','touchcancel'].forEach(function(ev){
    node.addEventListener(ev, function(){ clearTimeout(timer); }, {passive:true});
  });
}
function kontextMenue(ev, titel, eintraege){
  var alt=document.querySelector('.kmenu'); if(alt)alt.remove();
  var box=el('div','kmenu');
  if(titel) box.appendChild(el('div','kkopf',titel));
  eintraege.forEach(function(e){
    if(e==='-'){ box.appendChild(el('div','trenn')); return; }
    var b=el('button',null,e.t);
    b.onclick=function(){ box.remove(); e.fn(); };
    box.appendChild(b);
  });
  document.body.appendChild(box);
  var x=(ev.touches&&ev.touches[0]?ev.touches[0].clientX:ev.clientX)||40;
  var y=(ev.touches&&ev.touches[0]?ev.touches[0].clientY:ev.clientY)||40;
  var b=box.getBoundingClientRect();
  box.style.left=Math.max(6,Math.min(x, window.innerWidth-b.width-8))+'px';
  box.style.top=Math.max(6,Math.min(y, window.innerHeight-b.height-8))+'px';
  setTimeout(function(){
    document.addEventListener('click', function zu(){ box.remove(); document.removeEventListener('click',zu); });
  },10);
}

/* Rueckgaengig fuer Zuweisungen */
var rueck=[];
function merkeStand(sh, was){
  rueck.push({sh:sh, plaetze:JSON.parse(JSON.stringify(sh.plaetze)), was:was});
  if(rueck.length>40)rueck.shift();
}
function rueckgaengig(){
  var r=rueck.pop();
  if(!r){toast('Nichts zum Rückgängigmachen.');return;}
  r.sh.plaetze=r.plaetze; speichern(); zeichne();
  toast('Rückgängig: '+r.was);
}

function tagePlan(){
  var t={}; mFahrten().forEach(function(f){t[f.datum]=true;});
  return Object.keys(t).sort();
}
function personAmTag(crewId, datum){
  var treffer=[];
  mFahrten().filter(function(f){return f.datum===datum;}).forEach(function(f){
    f.shuttles.forEach(function(sh){
      for(var k in sh.plaetze) if(sh.plaetze[k].crewId===crewId)
        treffer.push({f:f, sh:sh, sitz:k, b:sh.plaetze[k]});
    });
  });
  return treffer;
}
function zuweisen(f, sh, sitz, crewId){
  if(!crewId){toast('Erst jemanden in der Crew-Liste antippen.');return;}
  if(sh.plaetze[sitz]){toast('Der Platz ist schon belegt.');return;}
  if((sh.gesperrt||[]).indexOf(sitz)>=0){toast('Der Platz ist für Gepäck gesperrt.');return;}
  var vorher=meinPlatz(f, crewId);
  merkeStand(sh, name(crewById(crewId))+' in '+(fzById(sh.fahrzeugId)||{}).name);
  if(vorher && vorher.sh===sh) delete sh.plaetze[vorher.sitz];
  else if(vorher){ merkeStand(vorher.sh, 'alter Platz'); delete vorher.sh.plaetze[vorher.sitz]; }
  sh.plaetze[sitz]={crewId:crewId, status:'bestaetigt', ts:new Date().toISOString()};
  protokoll(name(crewById(crewId))+' in '+(fzById(sh.fahrzeugId)||{}).name+' eingeteilt');
  speichern(); zeichne();
}
function zuweisungLoesen(f, sh, sitz){
  var b=sh.plaetze[sitz]; if(!b)return;
  merkeStand(sh, 'Platz von '+name(crewById(b.crewId)));
  delete sh.plaetze[sitz];
  protokoll(name(crewById(b.crewId))+' aus '+(fzById(sh.fahrzeugId)||{}).name+' entfernt');
  speichern(); zeichne();
}

            zu.klasse=(zu.klasse||'')+' wahl';

          if(def.typ==='fahrer')return;

          ansicht.sitzWahl={fahrtId:f.id, shuttleId:sh.id, sitz:sid};

      });
      /* Doppeltippen und Menue je Platz */
      Array.prototype.forEach.call(svg.querySelectorAll('.seat'), function(g){

      vw.appendChild(svg); sc.appendChild(vw);

  function zeichneCrewListe(){
    var box=leeren($('crewListe'));
    var kopfz=el('div','row'); kopfz.style.marginBottom='6px';
    var h=el('span',null,'Crew · '+mCrew().length);
    h.style.fontFamily='var(--disp)'; h.style.fontWeight='700';
    kopfz.appendChild(h);
    var bn=el('button','btn klein','+ Person');
    bn.onclick=function(){crewBearbeiten(null);};
    kopfz.appendChild(bn);
    box.appendChild(kopfz);

    var such=(ansicht.suche||'').toLowerCase();
    var liste=mCrew().filter(function(c){
      if(such && (name(c)+' '+gewerkVon(c)).toLowerCase().indexOf(such)<0)return false;
      if(ansicht.nurOhne && personAmTag(c.id, ansicht.tag).length)return false;
      return true;
    }).sort(function(a,b){return name(a)<name(b)?-1:1;});

    if(!liste.length) box.appendChild(el('div','leer','Niemand gefunden.'));

    function zeile(c){
      var eintraege=personAmTag(c.id, ansicht.tag);
      var r=el('div','crewrow'+(eintraege.length?' verplant':'')+
        (c.faehrtSelbst?' selbst':'')+(ansicht.crewWahl===c.id?' gewaehlt':''));
      var chip=el('span','kchip',c.kuerzel||'??');
      r.appendChild(chip);
      var nm=el('div','cname'); nm.appendChild(document.createTextNode(name(c)));
      var unten=gewerkVon(c)+(c.info?' · '+c.info:'')+(c.faehrtSelbst?' · fährt selbst':'');
      nm.appendChild(el('small',null,unten));
      r.appendChild(nm);
      eintraege.forEach(function(e){
        var ch=el('span','sitzchip'+(e.b.status==='angefragt'?' offen':''),
          e.f.zeit+' · '+kurzFz(fzById(e.sh.fahrzeugId)));
        ch.title=(fzById(e.sh.fahrzeugId)||{}).name+' · '+e.f.richtung;
        r.appendChild(ch);
      });
      r.onclick=function(){
        ansicht.crewWahl=(ansicht.crewWahl===c.id?null:c.id);
        if(ansicht.crewWahl && ansicht.sitzWahl){
          var f=fahrtById(ansicht.sitzWahl.fahrtId);
          var sh=null;
          if(f)f.shuttles.forEach(function(x){if(x.id===ansicht.sitzWahl.shuttleId)sh=x;});
          if(f&&sh&&!sh.plaetze[ansicht.sitzWahl.sitz]){
            zuweisen(f,sh,ansicht.sitzWahl.sitz,c.id);
            ansicht.crewWahl=null; ansicht.sitzWahl=null; return;
          }
        }
        zeichne();
      };
      aufDoppel(r, function(){
        if(!ansicht.sitzWahl){ toast('Erst rechts einen freien Platz antippen.'); return; }
        var f=fahrtById(ansicht.sitzWahl.fahrtId), sh=null;
        if(f)f.shuttles.forEach(function(x){if(x.id===ansicht.sitzWahl.shuttleId)sh=x;});
        if(!f||!sh)return;
        zuweisen(f,sh,ansicht.sitzWahl.sitz,c.id);
        ansicht.sitzWahl=null; ansicht.crewWahl=null;
      });
      aufKontext(r, function(ev){
        var eint=[
          {t:'Info hinzufügen oder ändern', fn:function(){infoDialog(c);}},
          {t:(c.faehrtSelbst?'„fährt selbst" aufheben':'Als „fährt selbst" merken'), fn:function(){
            c.faehrtSelbst=!c.faehrtSelbst;
            protokoll(name(c)+(c.faehrtSelbst?' fährt selbst':' fährt wieder mit'));
            speichern();zeichne();}},
          {t:'Gewerk ändern', fn:function(){gewerkDialog(c);}},
          '-'
        ];
        if(eintraege.length){
          eint.push({t:'Aus dieser Fahrt entfernen', fn:function(){
            zuweisungLoesen(eintraege[0].f, eintraege[0].sh, eintraege[0].sitz);}});
          eint.push({t:'Aus allen Fahrten des Tages entfernen', fn:function(){
            eintraege.forEach(function(e){ merkeStand(e.sh,'Tagesplan '+name(c)); delete e.sh.plaetze[e.sitz]; });
            protokoll(name(c)+' aus allen Fahrten am '+datumKurz(ansicht.tag)+' entfernt');
            speichern();zeichne();}});
          eint.push('-');
        }
        eint.push({t:'Person bearbeiten', fn:function(){crewBearbeiten(c);}});
        eint.push({t:'Person aus der Crew löschen', fn:function(){
          frage('Person löschen',name(c)+' wirklich aus der Crew-Liste löschen?','Löschen',function(){
            S.crew=S.crew.filter(function(x){return x!==c;});
            protokoll(name(c)+' aus der Crew gelöscht'); speichern(); zeichne();
          },'warn');}});
        kontextMenue(ev, name(c), eint);
      });
      return r;
    }

    if(S.einst.gruppieren){
      var gruppen={};
      liste.forEach(function(c){ (gruppen[gewerkVon(c)]=gruppen[gewerkVon(c)]||[]).push(c); });
      var namen=Object.keys(gruppen).sort(function(a,b){
        var ia=GEWERKE.indexOf(a), ib=GEWERKE.indexOf(b);
        if(ia<0)ia=99; if(ib<0)ib=99;
        return ia===ib ? (a<b?-1:1) : ia-ib;
      });
      namen.forEach(function(g){
        var frei=gruppen[g].filter(function(c){return !personAmTag(c.id,ansicht.tag).length;}).length;
        box.appendChild(el('div','gwkopf',g+' · '+gruppen[g].length+(frei?' ('+frei+' offen)':'')));
        gruppen[g].forEach(function(c){ box.appendChild(zeile(c)); });
      });
    } else {
      liste.forEach(function(c){ box.appendChild(zeile(c)); });
    }
  }
  zeichneCrewListe();
}

function autoVerteilen(){
  var f=mFahrten().filter(function(x){return x.datum===ansicht.tag;})
    .sort(function(a,b){return a.zeit<b.zeit?-1:1;});
  if(!f.length){toast('Für den Tag gibt es keine Fahrt.');return;}
  dialog('Rest automatisch verteilen',function(bd){
    bd.appendChild(el('label','feld','Auf welche Abfahrt?'));
    var sel=el('select'); sel.id='avF';
    f.forEach(function(x){
      var o=el('option',null,x.zeit+' Uhr · '+x.richtung+' · '+fahrtFrei(x)+' frei');
      o.value=x.id; sel.appendChild(o);
    });
    bd.appendChild(sel);
    bd.appendChild(el('p',null,'Alle noch nicht eingeteilten Personen werden der Reihe nach auf freie Plätze gesetzt. „Fährt selbst" wird übersprungen.'));
  },[{text:'Abbrechen'},{text:'Verteilen',art:'pri',fn:function(bd){
    var f2=fahrtById(bd.querySelector('#avF').value); if(!f2)return;
    var offen=mCrew().filter(function(c){
      return !c.faehrtSelbst && !meinPlatz(f2,c.id);
    });
    var n=0;
    f2.shuttles.forEach(function(sh){
      merkeStand(sh,'automatische Verteilung');
      VANS.buchbar(vorlageVon(sh)).forEach(function(sitz){
        if(!offen.length)return;
        if(sh.plaetze[sitz.id])return;
        if((sh.gesperrt||[]).indexOf(sitz.id)>=0)return;
        var c=offen.shift();
        sh.plaetze[sitz.id]={crewId:c.id,status:'bestaetigt',ts:new Date().toISOString()};
        n++;
      });
    });
    protokoll(n+' Personen automatisch auf die Fahrt '+f2.zeit+' verteilt');
    speichern(); zeichne();
    toast(n+' Personen eingeteilt'+(offen.length?', '+offen.length+' ohne Platz.':'.'));
  }}]);
}

function fahrtLink(f){
  var b=S.einst.basisLink||'';
  return b+(b.indexOf('?')>=0?'&':'?')+'f='+f.id;
}

/* ---------- Bausteine für den Text ---------- */
function shuttleBlock(f){
  var t='';
  f.shuttles.forEach(function(sh){
    var fz=fzById(sh.fahrzeugId)||{}, vl=VANS.VORLAGEN[fz.vorlage]||{};
    t+='🕒 '+(sh.zeit||f.zeit)+' Uhr · '+fz.name+'\n';
    t+='   '+(vl.kurz||'')+' · '+(fz.kennzeichen||'')+' · Fahrer '+fahrerName(fz)+'\n';
    t+='   '+freiCount(sh)+' von '+kapazitaet(sh)+' Plätzen frei\n';
  });
  return t;
}
function besetzungBlock(f){
  var zeilen=[];
  f.shuttles.forEach(function(sh){
    var fz=fzById(sh.fahrzeugId)||{}, liste=[];
    VANS.buchbar(vorlageVon(sh)).forEach(function(sz){
      var b=sh.plaetze[sz.id];
      if(b) liste.push(nameKurz(crewById(b.crewId))+(b.status==='angefragt'?' (offen)':''));
    });
    if(liste.length) zeilen.push('🚐 '+fz.name+' ('+(fz.kennzeichen||'')+'): '+liste.join(', '));
  });
  return zeilen.join('\n');
}
function tagWort(f){
  if(f.datum===heuteISO())return 'heute';
  if(f.datum===plusTage(heuteISO(),1))return 'morgen';
  return datumLang(f.datum);
}
var PLATZHALTER=[
  ['{kuenstler}','Künstler'],['{tour}','Tour'],['{stadt}','Stadt'],
  ['{datum}','Datum kurz'],['{datum_lang}','Datum lang'],['{tag_wort}','heute/morgen'],
  ['{zeit}','Abfahrtszeit'],['{richtung}','Richtung'],['{treffpunkt}','Treffpunkt'],
  ['{ziel}','Ziel'],['{hinweis}','Hinweis'],['{shuttles}','Liste der Shuttles'],
  ['{besetzung}','Wer sitzt wo'],['{freie_plaetze}','freie Plätze'],['{link}','Link zum Buchen'],
  ['{gruss}','Anrede'],['{signatur}','Unterschrift'],
  ['{fahrer_liste}','Fahrer mit Zeiten'],['{anzahl}','Personen gesamt'],
  ['{tm_kontakt}','Kontakt Tourmanagement'],['{gruppe}','Name der Fahrer-Gruppe']
];
function werte(f){
  var t=tour();
  return {
    '{kuenstler}': t?t.kuenstler:'', '{tour}': t?t.tour+' '+t.jahr:'',
    '{stadt}': f.stadt||S.einst.stadt||'',
    '{datum}': datumKurz(f.datum), '{datum_lang}': datumLang(f.datum), '{tag_wort}': tagWort(f),
    '{zeit}': f.zeit, '{richtung}': f.richtung, '{treffpunkt}': f.von, '{ziel}': f.nach,
    '{hinweis}': f.hinweis?('ℹ️ '+f.hinweis+'\n'):'',
    '{shuttles}': shuttleBlock(f), '{besetzung}': besetzungBlock(f),
    '{freie_plaetze}': String(fahrtFrei(f)), '{link}': fahrtLink(f),
    '{gruss}': S.einst.gruss||'', '{signatur}': S.einst.signatur||'',
    '{fahrer_liste}': fahrerListe(f), '{anzahl}': String(anzahlGaeste(f)),
    '{tm_kontakt}': S.einst.tmKontakt||'', '{gruppe}': stadtInfo(f.stadt||S.einst.stadt).fahrerGruppe||''
  };
}
function fuelleText(text, f){
  var w=werte(f), t=String(text||'');
  for(var k in w) t=t.split(k).join(w[k]);
  return t;
}
/* Werte zurück in Platzhalter verwandeln, damit aus einem Text eine Vorlage wird */
function zuVorlage(text, f){
  var w=werte(f), t=String(text||'');
  ['{link}','{besetzung}','{shuttles}','{datum_lang}','{datum}','{treffpunkt}','{ziel}',
   '{zeit}','{richtung}','{stadt}','{kuenstler}','{signatur}','{gruss}','{hinweis}'].forEach(function(k){
    var v=w[k];
    if(v && String(v).length>2) t=t.split(v).join(k);
  });
  return t;
}

function fahrerListe(f){
  var t='';
  f.shuttles.forEach(function(sh){
    var fz=fzById(sh.fahrzeugId)||{}, n=belegtCount(sh);
    t+='🚐 '+fz.name+' · '+(fz.kennzeichen||'ohne Kennzeichen')+'\n';
    t+='   Fahrer: '+fahrerName(fz);
    var fa=fz.fahrerId?fahrerById(fz.fahrerId):null;
    if(fa&&fa.telefon)t+=' ('+fa.telefon+')';
    t+='\n';
    t+='   Abfahrt '+(sh.zeit||f.zeit)+' Uhr · '+f.von+' → '+f.nach+'\n';
    t+='   '+n+' '+(n===1?'Person':'Personen')+' an Bord\n';
  });
  return t;
}
function anzahlGaeste(f){var n=0;f.shuttles.forEach(function(sh){n+=belegtCount(sh);});return n;}

function standardText(f, art, empf){
  empf=empf||'crew';
  var v=null;
  mTexte(f.stadt).forEach(function(x){
    if(x.art!==art)return;
    if((x.empfaenger||'crew')!==empf)return;
    if(!v) v=x;
    else if(x.stadt && !v.stadt) v=x;   /* Stadt-Vorlage schlägt die allgemeine */
  });
  if(v) return fuelleText(v.text, f);
  if(empf==='fahrer')
    return fuelleText('Hallo zusammen,\nhier die Fahrten für {tag_wort} in {stadt}:\n\n{fahrer_liste}\nInsgesamt {anzahl} Personen.\n\n{signatur}\n{tm_kontakt}', f);
  return fuelleText('🚐 {datum} · {zeit} Uhr · {richtung}\n\n{gruss}\n\n{shuttles}\n📍 {treffpunkt} → {ziel}\n{hinweis}\n👉 {link}\n\n{signatur}', f);
}
function waText(f,empf){ return standardText(f,'ansage',empf); }
function waErinnerung(f,empf){ return standardText(f,'erinnerung',empf); }

function waTagesText(datum){
  var f=mFahrten().filter(function(x){return x.datum===datum;})
    .sort(function(a,b){return a.zeit<b.zeit?-1:1;});
  if(!f.length)return '';
  var stadt=f[0].stadt||S.einst.stadt||'';
  var t='🚐 SHUTTLE-PLAN · '+datumLang(datum).toUpperCase()+(stadt?' · '+stadt.toUpperCase():'')+'\n\n';
  t+=(S.einst.gruss||'Hallo liebe Crew,')+'\n';
  t+='hier der Shuttle-Plan für den Tag. Bitte tragt euch selbst ein.\n\n';
  f.forEach(function(x){
    t+='▪️ '+x.zeit+' Uhr · '+x.richtung+'\n';
    t+='   ab '+x.von+'\n';
    x.shuttles.forEach(function(sh){
      var fz=fzById(sh.fahrzeugId)||{};
      t+='   • '+fz.name+' ('+(fz.kennzeichen||'')+') · '+freiCount(sh)+'/'+kapazitaet(sh)+' frei\n';
    });
    if(x.hinweis)t+='   ℹ️ '+x.hinweis+'\n';
    t+='   👉 '+fahrtLink(x)+'\n\n';
  });
  t+=(S.einst.signatur||'Euer Tourmanagement');
  return t;
}

  empf=empf||'crew';
  leeren(box);
  var ta=el('textarea'); ta.value=starttext; ta.style.minHeight='230px';

      if(i%2===1)bub.appendChild(el('span','link',teil));
      else bub.appendChild(document.createTextNode(teil));
    });
    bub.appendChild(el('span','wazeit',pad(new Date().getHours())+':'+pad(new Date().getMinutes())+' ✓✓'));

  ta.oninput=vorschau; vorschau();

  var b2=el('button','btn','In WhatsApp öffnen');

function fahrerTagesText(datum, art){
  var f=mFahrten().filter(function(x){return x.datum===datum;})
    .sort(function(a,b){return a.zeit<b.zeit?-1:1;});
  if(!f.length)return '';
  var stadt=f[0].stadt||S.einst.stadt||'';
  var t='Hallo zusammen,\nhier die Shuttle-Fahrten für '+tagWort(f[0])+' in '+stadt+' ('+datumKurz(datum)+'):\n\n';
  f.forEach(function(x){
    t+='▪️ '+x.zeit+' Uhr · '+x.von+' → '+x.nach+'\n';
    x.shuttles.forEach(function(sh){
      var fz=fzById(sh.fahrzeugId)||{}, fa=fz.fahrerId?fahrerById(fz.fahrerId):null;
      t+='   🚐 '+fz.name+' ('+(fz.kennzeichen||'')+') · '+fahrerName(fz)+
         (fa&&fa.telefon?' '+fa.telefon:'')+' · '+belegtCount(sh)+' Personen\n';
    });
    if(x.hinweis)t+='   ℹ️ '+x.hinweis+'\n';
    t+='\n';
  });
  t+='Bitte seid 10 Minuten vor der Abfahrt am Treffpunkt.\n\n';
  t+=(S.einst.signatur||'Euer Tourmanagement');
  if(S.einst.tmKontakt)t+='\n'+S.einst.tmKontakt;
  return t;
}

function jsUrl(pfad){
  var j=S.einst.jshow, basis=(j.adresse||'').replace(/\/+$/,'');
  var voll=basis+(pfad.indexOf('/')===0?pfad:'/'+pfad);
  voll=voll.split('{plattform}').join(j.plattform||'');
  if(j.proxy) voll=j.proxy.replace(/\/+$/,'')+'/'+encodeURIComponent(voll);
  return voll;
}
function jsKopf(){
  var j=S.einst.jshow, h={'Accept':'application/json'};
  (j.kopf||'').split('\n').forEach(function(z){
    var i=z.indexOf(':'); if(i<0)return;
    h[z.slice(0,i).trim()]=z.slice(i+1).trim().split('{schluessel}').join(j.schluessel||'');
  });
  return h;
}
function jsFehlerText(e){
  var t=String(e&&e.message?e.message:e);
  if(t.indexOf('Failed to fetch')>=0||t.indexOf('NetworkError')>=0)
    return 'Der Browser durfte die Anfrage nicht stellen. Das ist fast immer die übliche Sperre zwischen zwei Webadressen. '+
           'Lösung: J.SHOW gibt unsere Adresse frei, oder wir setzen eine kleine Zwischenstelle davor und tragen sie oben als Zwischenstelle ein.';
  return t;
}

function crewAusJson(roh){
  var liste=[];
  try{
    var j=JSON.parse(roh);
    var arr=Array.isArray(j)?j:(j.data||j.crew||j.travelParty||j.travel_party||j.items||[]);
    arr.forEach(function(x){
      var nm=x.name||((x.firstName||x.first_name||x.vorname||'')+' '+
                      (x.lastName||x.last_name||x.nachname||'')).trim();
      if(!nm)return;
      liste.push({nm:nm, gw:x.department||x.gewerk||x.role||x.position||x.job||'',
                  tel:x.phone||x.telefon||x.mobile||''});
    });
  }catch(e){ toast('Das war keine lesbare JSON-Antwort.'); return; }
  if(!liste.length){ toast('Keine Personen erkannt.'); return; }
  var neuZahl=0, vorhanden=0;
  liste.forEach(function(x){
    var teile=x.nm.replace(',',' ').split(/\s+/).filter(Boolean);
    var vor=teile[0]||'', nach=teile.slice(1).join(' ');
    if(x.nm.indexOf(',')>=0){ nach=x.nm.split(',')[0].trim(); vor=(x.nm.split(',')[1]||'').trim(); }
    /* Vorname und Nachname koennen in beiden Reihenfolgen kommen -> beide pruefen */
    function suche(v,n){
      return mCrew().filter(function(c){
        return (c.vorname+'|'+c.nachname).toLowerCase()===(v+'|'+n).toLowerCase();
      })[0];
    }
    var da=suche(vor,nach) || suche(nach,vor);
    if(da){ if(x.tel)da.telefon=x.tel; if(x.gw)da.gewerk=x.gw; vorhanden++; return; }
    S.crew.push({id:uid('c'), tourId:tourId(), vorname:vor, nachname:nach,
      gewerk:x.gw||'ohne Gewerk', telefon:x.tel, info:'',
      kuerzel:((vor[0]||'')+(nach[0]||'')).toUpperCase()});
    neuZahl++;
  });
  protokoll(neuZahl+' Personen aus J.SHOW neu, '+vorhanden+' aktualisiert');
  speichern(); zeichne();
  toast(neuZahl+' neu, '+vorhanden+' aktualisiert.');
}
function termineAusJson(roh){
  var arr=[];
  try{
    var j=JSON.parse(roh);
    arr=Array.isArray(j)?j:(j.data||j.events||j.shows||j.items||[]);
  }catch(e){ toast('Das war keine lesbare JSON-Antwort.'); return; }
  var t=tour(), neuStadt=0, neuTag=0;
  t.staedte=t.staedte||[];
  arr.forEach(function(x){
    var stadt=x.city||x.stadt||(x.venue&&x.venue.city)||'';
    var datum=(x.date||x.datum||x.start||'').slice(0,10);
    var venue=x.venue&&x.venue.name?x.venue.name:(x.venue||x.location||'');
    if(stadt && t.staedte.indexOf(stadt)<0){ t.staedte.push(stadt); neuStadt++; }
    if(stadt){
      t.staedteInfo=t.staedteInfo||{};
      t.staedteInfo[stadt]=t.staedteInfo[stadt]||{fahrerGruppe:'',link:'',hotel:'',venue:''};
      if(venue&&!t.staedteInfo[stadt].venue)t.staedteInfo[stadt].venue=venue;
    }
    if(datum && stadt){
      var da=mFahrten().filter(function(f){return f.datum===datum;}).length;
      if(!da) neuTag++;
    }
  });
  protokoll(neuStadt+' Städte aus J.SHOW übernommen');
  speichern(); zeichne();
  toast(neuStadt+' Städte übernommen'+(neuTag?', '+neuTag+' Showtage ohne Fahrten — Tagesvorlage anwenden.':'.'));
}

function jshowPaket(datum){
  var t=tour();
  return {
    quelle:'AMK Shuttle', stand:new Date().toISOString(),
    tour:{id:t.id, kuenstler:t.kuenstler, tour:t.tour, jahr:t.jahr},
    tag:datum, stadt:(mFahrten().filter(function(f){return f.datum===datum;})[0]||{}).stadt||'',
    fahrten:mFahrten().filter(function(f){return f.datum===datum;}).map(function(f){
      return {
        zeit:f.zeit, richtung:f.richtung, treffpunkt:f.von, ziel:f.nach, hinweis:f.hinweis,
        shuttles:f.shuttles.map(function(sh){
          var fz=fzById(sh.fahrzeugId)||{};
          var plaetze=[];
          for(var k in sh.plaetze){
            var c=crewById(sh.plaetze[k].crewId)||{};

          }

                  fahrer:fahrerName(fz), plaetze:plaetze, frei:freiCount(sh)};
        })
      };
    })
  };
}

    var n=0;
    liste.forEach(function(x){
      var teile=x.nm.split(/\s+/);
      var nach=teile[0], vor=teile.slice(1).join(' ');
      if(x.nm.indexOf(',')<0 && teile.length>1){ vor=teile[0]; nach=teile.slice(1).join(' '); }
      S.crew.push({id:uid('c'), tourId:tourId(), vorname:vor, nachname:nach,
        gewerk:x.gw||'ohne Gewerk', telefon:x.tel, info:'',
        kuerzel:((vor[0]||'')+(nach[0]||'')).toUpperCase()});
      n++;
    });
    protokoll(n+' Personen aus J.SHOW eingelesen');
    speichern(); zeichne(); toast(n+' Personen eingelesen.');
  }}]);
}

/* ==========================================================
   Start
   ========================================================== */
function start(){
  laden();
  $('btnEinst').onclick=einstellungen;
  /* Link-Parameter: ?f=Fahrt  ?p=Person  ?rolle=crew */
  var q={}; location.search.replace(/^\?/,'').split('&').forEach(function(p){
    if(!p)return; var t=p.split('='); q[decodeURIComponent(t[0])]=decodeURIComponent(t[1]||'');
  });
  if(q.rolle==='crew'||q.rolle==='admin'){S.einst.rolle=q.rolle;}
  if(q.p&&crewById(q.p)){S.einst.ich=q.p;}
  if(q.f&&fahrtById(q.f)){ansicht.fahrtId=q.f;}
  if(!istAdmin()&&ansicht.tab!=='fahrten'&&ansicht.tab!=='meine')ansicht.tab='fahrten';
  zeichne();
  /* Restzeiten laufend nachziehen */
  setInterval(function(){ if(!document.querySelector('.ovl')) zeichne(); }, 60000);
}
start();
</script>
